name: DeerStop
options:
  bundleIdPrefix: gr.polychronis
  deploymentTarget:
    iOS: "17.0"

targets:
  DeerStop:
    type: application
    platform: iOS
    sources:
      - path: DeerStop
        excludes:
          - "**/* 2*"
          - Info.plist
    settings:
      INFOPLIST_FILE: Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: gr.polychronis.DeerStop
      DEVELOPMENT_TEAM: UTM6JGT4J8
      CODE_SIGN_STYLE: Automatic
      SWIFT_VERSION: "5.9"
      GENERATE_INFOPLIST_FILE: true
    dependencies:
      - package: WebRTC
    scheme:
      testTargets: []

packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: "140.0.0"
